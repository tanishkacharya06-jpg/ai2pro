name: Build AI Camera v1.6 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Extract original v1.6 Android project
        run: |
          base64 --decode AICamera-v1.6-source.zip.b64 > /tmp/aicamera-v1.6.zip
          unzip -q /tmp/aicamera-v1.6.zip -d source-unpacked
          test -f source-unpacked/android-project/app/src/main/java/com/example/aicamera/MainActivity.kt
          grep -q 'androidx.compose.ui.viewinterop.AndroidView' source-unpacked/android-project/app/src/main/java/com/example/aicamera/MainActivity.kt || grep -q 'import androidx.compose.ui.viewinterop.AndroidView' source-unpacked/android-project/app/src/main/java/com/example/aicamera/MainActivity.kt
      - name: Build original v1.6 project
        working-directory: source-unpacked/android-project
        run: gradle assembleDebug --no-daemon
      - name: Verify and stage APK
        run: |
          test -s source-unpacked/android-project/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose source-unpacked/android-project/app/build/outputs/apk/debug/app-debug.apk
          cp source-unpacked/android-project/app/build/outputs/apk/debug/app-debug.apk AICamera-v1.6-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AICamera-v1.6-apk
          path: AICamera-v1.6-debug.apk
          if-no-files-found: error
          retention-days: 30
