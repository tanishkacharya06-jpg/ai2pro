name: Build AI Camera Android v2.0
on:
  push:
    branches: [v1.9-direct-camera, v2.0-camera-gallery-overhaul]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build v2.0 APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon
      - name: Verify APK and package source
        run: |
          APK=android-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" AICamera-Android-v2.0-debug.apk
          zip -qr AICamera-Android-v2.0-source.zip android-project server \
            -x '*/build/*' '*/.gradle/*' '*.apk' '*.aab'
      - uses: actions/upload-artifact@v4
        with:
          name: AICamera-Android-v2.0-delivery
          path: |
            AICamera-Android-v2.0-debug.apk
            AICamera-Android-v2.0-source.zip
          if-no-files-found: error
          retention-days: 30
