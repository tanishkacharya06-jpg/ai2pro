name: Build AI Camera Android v1.9
on:
  push:
    branches: [v1.9-camera-first]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Validate server Python syntax
        run: python -m py_compile server/server.py server/tunnel.py server/chatgpt.py
      - name: Build v1.9 APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon
      - name: Verify APK and package delivery files
        run: |
          APK=android-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" AICamera-Android-v1.9-debug.apk
          zip -qr AICamera-Android-v1.9-source.zip android-project server \
            -x '*/build/*' '*/.gradle/*' '*.apk' '*.aab' 'server/data.db' 'server/jobs/*' 'server/chatgpt_profile/*'
          (cd server && zip -qr ../AICamera-Server-v1.9-host.zip . \
            -x 'data.db' 'jobs/*' 'chatgpt_profile/*' '__pycache__/*' '*.pyc')
          test -s AICamera-Server-v1.9-host.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AICamera-Android-v1.9-delivery
          path: |
            AICamera-Android-v1.9-debug.apk
            AICamera-Android-v1.9-source.zip
            AICamera-Server-v1.9-host.zip
          if-no-files-found: error
          retention-days: 30
