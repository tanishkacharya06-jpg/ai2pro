<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>AI Camera</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel=stylesheet>
<style>
:root{--ink:#2b2338;--mut:#8a7f9c;--rose:#ff8fb1;--lilac:#a98bff;--peach:#ffc6a1;--mint:#a8efe0;--glass:#ffffff94;--bd:#ffffffc4}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,'Segoe UI',system-ui,sans-serif;font-weight:400;color:var(--ink);min-height:100vh;background:#fbf4ff;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.8;animation:dr 20s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vw;height:60vw;background:var(--peach);top:-22vw;left:-12vw}
.aurora i:nth-child(2){width:55vw;height:55vw;background:var(--rose);bottom:-22vw;right:-10vw;animation-delay:-6s}
.aurora i:nth-child(3){width:48vw;height:48vw;background:var(--lilac);top:18vh;left:38vw;opacity:.55;animation-delay:-11s}
.aurora i:nth-child(4){width:36vw;height:36vw;background:var(--mint);bottom:4vh;left:-8vw;opacity:.6;animation-delay:-3s}
@keyframes dr{to{transform:translate(9vw,7vh) scale(1.18)}}
.wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-style:italic}
.hero{text-align:center;margin:34px 0 8px;animation:up .8s both}
.hero h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(34px,7vw,58px);line-height:1.08;margin:0}
.hero em{background:linear-gradient(120deg,var(--rose),var(--lilac));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-weight:300;margin:12px 0 0}
.card{background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--bd);border-radius:32px;padding:26px;margin:18px 0;box-shadow:0 24px 60px #a98bff2e;animation:up .7s both}
.card:nth-of-type(2){animation-delay:.08s}.card:nth-of-type(3){animation-delay:.16s}.card:nth-of-type(4){animation-delay:.24s}
@keyframes up{from{transform:translateY(26px);opacity:0}}
.step{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mut);margin-bottom:16px}
.btn{position:relative;overflow:hidden;border:0;border-radius:99px;padding:13px 30px;font:500 15px Poppins,sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--rose),var(--lilac));box-shadow:0 12px 28px #ff8fb155;transition:.25s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff7 50%,transparent 70%);transform:translateX(-120%);transition:.6s}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 34px #ff8fb170}.btn:hover::after{transform:translateX(120%)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:wait;transform:none}
.btn.ghost{background:#ffffffa8;color:var(--ink);border:1px solid var(--bd);box-shadow:none}.btn.sm{padding:8px 18px;font-size:13px}
.btn.big{font-size:17px;padding:16px 56px}
input,textarea,select{width:100%;padding:13px 16px;background:#ffffffb8;color:var(--ink);border:1px solid var(--bd);border-radius:16px;font:inherit;margin:6px 0;transition:.2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--lilac);box-shadow:0 0 0 4px #a98bff30}
select{width:auto;padding:9px 14px}textarea{min-height:150px;resize:vertical}
.auth{max-width:420px;margin:60px auto}.auth h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:32px;margin:0 0 4px}
.auth .sub{color:var(--mut);margin:0 0 16px;font-weight:300}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs .btn{flex:1}
.drop{border:1.5px dashed #a98bff99;border-radius:26px;min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;color:var(--mut);transition:.3s;overflow:hidden;padding:8px}
.drop:hover,.drop.over{background:#fff6;border-color:var(--lilac);transform:scale(1.01)}
.drop svg{display:block;margin:0 auto 10px;color:var(--lilac);animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
#pv{max-width:100%;max-height:340px;border-radius:20px;cursor:zoom-in;box-shadow:0 12px 30px #0003}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--bd);color:var(--ink);background:#ffffffa8;border-radius:99px;padding:10px 20px;font:500 14px Poppins,sans-serif;cursor:pointer;transition:.25s}
.chip:hover{transform:translateY(-2px);box-shadow:0 8px 18px #a98bff30}
.chip.on{background:linear-gradient(135deg,var(--rose),var(--lilac));color:#fff;border-color:transparent;box-shadow:0 10px 24px #a98bff55}
.chip.new{border-style:dashed;color:var(--lilac)}.chip i{font-style:normal;margin-left:8px;opacity:.75}
.center{text-align:center}
.bar{height:5px;border-radius:9px;background:#a98bff2a;overflow:hidden;margin:18px auto 6px;max-width:340px}
.bar i{display:block;height:100%;width:35%;border-radius:9px;background:linear-gradient(90deg,var(--rose),var(--lilac));animation:sl 1.2s ease-in-out infinite}
@keyframes sl{from{margin-left:-35%}to{margin-left:100%}}
#st{color:var(--mut);font-weight:300;min-height:22px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.item{text-align:center;animation:up .7s both}
.cmp{position:relative;border-radius:26px;overflow:hidden;cursor:ew-resize;touch-action:pan-y;user-select:none;line-height:0;box-shadow:0 18px 44px #a98bff44;--x:50%}
.cmp img{width:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.cmp .top{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.cmp .top img{height:100%;object-fit:cover}
.cmp .hd{position:absolute;top:0;bottom:0;left:var(--x);width:2px;background:#fff;box-shadow:0 0 14px #0006;transform:translateX(-1px)}
.cmp .hd b{position:absolute;top:50%;left:50%;width:42px;height:42px;margin:-21px;border-radius:50%;background:#fff;color:var(--lilac);display:flex;align-items:center;justify-content:center;font:600 15px Poppins;box-shadow:0 6px 18px #0004}
.tag{position:absolute;top:14px;font:500 11px Poppins;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:#0005;backdrop-filter:blur(6px);padding:5px 12px;border-radius:99px}
.tag.l{left:14px}.tag.r{right:14px}
.cmp.big{display:inline-block;border-radius:18px}.cmp.big .base{max-width:96vw;max-height:90vh;width:auto}
.dlrow{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;color:var(--mut);flex-wrap:wrap}
#lb{position:fixed;inset:0;background:#1d1230d9;backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lb.on{display:flex}#lb>img,#lb .cmp{animation:zm .45s cubic-bezier(.2,1.2,.4,1)}#lb>img{max-width:96vw;max-height:94vh;border-radius:18px}
@keyframes zm{from{transform:scale(.8);opacity:0}}
#lb .x{position:absolute;top:16px;right:20px;color:#fff;font-size:30px;cursor:pointer;line-height:1}
#modal{position:fixed;inset:0;background:#1d123099;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
#modal .card{width:100%;max-width:560px;margin:0;background:#fffffff2}
.badge{background:linear-gradient(135deg,var(--rose),var(--lilac));color:#fff;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:1px}
.hide{display:none!important}#msg{color:#d6246e;min-height:22px;font-size:14px}
</style></head><body>
<div class=aurora><i></i><i></i><i></i><i></i></div>
<div id=lb onclick="if(event.target==this||event.target.className=='x')closeLb()"></div>
<div class=wrap>
<header><div class=logo>AI Camera</div>
<div id=who class=hide><span id=un></span> <span id=adm class="badge hide">ADMIN</span>
<button class="btn ghost sm" onclick=phone()>Phone app</button> <button class="btn ghost sm" onclick=chpw()>Password</button> <button class="btn ghost sm" onclick=logout()>Log out</button></div></header>

<section id=auth class="card auth"><h2>Welcome</h2><p class=sub>Sign in to continue</p>
<div class=tabs><button class="btn sm" id=tl onclick="tab('login')">Log in</button><button class="btn sm ghost" id=ts onclick="tab('signup')">Create account</button></div>
<input id=lu placeholder="Username" autocomplete=username><input id=lp type=password placeholder="Password" onkeydown="if(event.key=='Enter')submitAuth()">
<div id=msg></div><button class=btn style="width:100%" id=ab onclick=submitAuth()>Log in</button></section>

<section id=app class=hide>
<div class=hero><h1>Make every photo <em>luminous</em>.</h1><p>Choose a photo, pick a style, and watch it unwrap.</p></div>
<div class=card><div class=step>01 — Photo</div>
<div class=drop id=drop><div id=ph><svg width=46 height=46 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.2><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx=12 cy=13 r=3.5 /></svg>Tap to choose or take a photo, or drop one here</div><img id=pv class=hide></div>
<div class=center style="margin-top:14px"><button id=chg class="btn ghost sm hide" onclick="$('f').click()">Change photo</button></div>
<input type=file id=f accept="image/*" class=hide></div>
<div class=card><div class=step>02 — Style</div><div class=chips id=chips></div></div>
<div class="card center"><button class="btn big" id=go onclick=go()>Enhance</button>
<div id=prog class=hide><div class=bar><i></i></div></div><div id=st></div></div>
<div class="card hide" id=res><div class=step>03 — Result · drag the handle, tap to view full screen</div><div class=grid id=grid></div>
<div class=dlrow>Download as <select id=fmt><option value=png>PNG · lossless</option><option value=jpeg>JPG · max quality</option><option value=webp>WEBP · max quality</option></select></div></div>
</section></div>

<div id=modal class=hide><div class=card><div class=step id=mt>Prompt</div>
<input id=pn placeholder="Button name"><textarea id=pt placeholder="Prompt text sent to ChatGPT"></textarea><div id=pm style="color:#d6246e"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class=btn onclick=savePrompt()>Save</button>
<button class="btn ghost" onclick="$('modal').classList.add('hide')">Cancel</button><button class="btn ghost hide" id=pd onclick=delPrompt()>Delete</button></div></div></div>

<script>
const $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let ME,PR=[],SEL=+localStorage.sel||0,MODE='login',EDIT=0,BUSY=false,S={file:null,results:[],job:null},OU='',RU=[];
const DBP=new Promise((res,rej)=>{const r=indexedDB.open('aicam',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idb(m,k,v){const d=await DBP;return new Promise((res,rej)=>{const o=d.transaction('s',m=='get'?'readonly':'readwrite').objectStore('s');const q=m=='get'?o.get(k):m=='set'?o.put(v,k):o.delete(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
const save=()=>idb('set',ME.name+':s',S).catch(()=>{});
async function api(p,o){const r=await fetch(p,o);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch{}throw new Error(m)}return r}
const J=(m,b)=>({method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
function tab(m){MODE=m;$('tl').classList.toggle('ghost',m!='login');$('ts').classList.toggle('ghost',m!='signup');$('ab').textContent=m=='login'?'Log in':'Create account';$('msg').textContent=''}
async function submitAuth(){try{enter(await (await api('/api/'+MODE,J('POST',{name:$('lu').value,password:$('lp').value}))).json())}catch(e){$('msg').textContent=e.message}}
async function enter(u){ME=u;$('auth').classList.add('hide');$('app').classList.remove('hide');$('who').classList.remove('hide');$('un').textContent=u.name+' ';$('adm').classList.toggle('hide',!u.admin);await loadPrompts();await restore()}
async function phone(){try{const p=await (await api('/api/device/pair-code',J('POST',{}))).json();const r=await (await api('/api/pair')).json();alert('AI Camera · Connect a phone\n\n4-digit pairing code: '+p.code+'\nExpires in 5 minutes. Use it once in the app.\n\nServer connection code: '+r.code+'\nPublic URL: '+(r.url||'(starting - try again in a few seconds)')+'\n\nKeep this code private. Your website login remains unchanged.')}catch(e){alert(e.message)}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
async function chpw(){const o=prompt('Current password:');if(o===null)return;const n=prompt('New password (4+ characters):');if(!n)return;try{await api('/api/password',J('POST',{old:o,new:n}));alert('Password changed')}catch(e){alert(e.message)}}
async function loadPrompts(){PR=await (await api('/api/prompts')).json();if(!PR.find(p=>p.id==SEL))SEL=PR[0].id;draw()}
function draw(){const c=$('chips');c.innerHTML='';PR.forEach(p=>{const b=document.createElement('button');b.className='chip'+(p.id==SEL?' on':'');b.textContent=p.name;
 if(ME.admin){const e=document.createElement('i');e.textContent='✎';e.onclick=ev=>{ev.stopPropagation();edit(p)};b.appendChild(e)}
 b.onclick=()=>{SEL=p.id;localStorage.sel=SEL;draw()};c.appendChild(b)});
 if(ME.admin){const n=document.createElement('button');n.className='chip new';n.textContent='+ New prompt';n.onclick=()=>edit(null);c.appendChild(n)}}
function edit(p){EDIT=p?p.id:0;$('mt').textContent=p?'Edit prompt':'New prompt';$('pn').value=p?p.name:'';$('pt').value=p?p.text:'';$('pm').textContent='';$('pd').classList.toggle('hide',!p);$('modal').classList.remove('hide')}
async function savePrompt(){try{await api(EDIT?'/api/prompts/'+EDIT:'/api/prompts',J(EDIT?'PUT':'POST',{name:$('pn').value,text:$('pt').value}));$('modal').classList.add('hide');await loadPrompts()}catch(e){$('pm').textContent=e.message}}
async function delPrompt(){if(!confirm('Delete this prompt button?'))return;try{await api('/api/prompts/'+EDIT,{method:'DELETE'});$('modal').classList.add('hide');await loadPrompts()}catch(e){$('pm').textContent=e.message}}

/* photo + persistence */
function setPhoto(f,fresh){S.file=f;OU=URL.createObjectURL(f);$('pv').src=OU;$('pv').classList.remove('hide');$('ph').classList.add('hide');$('chg').classList.remove('hide');
 if(fresh){S.results=[];S.job=null;$('res').classList.add('hide');$('st').textContent='';save()}}
$('f').onchange=e=>{if(e.target.files[0])setPhoto(e.target.files[0],true);e.target.value=''};
$('pv').onclick=e=>{e.stopPropagation();openLb(OU)};
$('drop').onclick=()=>{if(!S.file)$('f').click()};
['dragover','dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.toggle('over',t=='dragover');if(t=='drop'&&e.dataTransfer.files[0])setPhoto(e.dataTransfer.files[0],true)}));
async function restore(){const s=await idb('get',ME.name+':s').catch(()=>null);if(!s)return;S=Object.assign(S,s);
 if(S.file)setPhoto(S.file,false);if(S.results&&S.results.length)showResults(false);if(S.job)resume(S.job)}

/* before/after slider */
function makeCmp(o,r,big,x){const d=document.createElement('div');d.className='cmp'+(big?' big':'');d.style.setProperty('--x',x||'50%');
 d.innerHTML='<img class=base src="'+r+'"><div class=top><img src="'+o+'"></div><span class="tag l">Before</span><span class="tag r">After</span><div class=hd><b>‹ ›</b></div>';
 let down=false,moved=0,sx=0;const set=cx=>{const b=d.getBoundingClientRect();d.style.setProperty('--x',Math.min(100,Math.max(0,(cx-b.left)/b.width*100))+'%')};
 d.onpointerdown=e=>{down=true;moved=0;sx=e.clientX;d._stop=true;d.setPointerCapture(e.pointerId)};
 d.onpointermove=e=>{if(!down)return;moved=Math.max(moved,Math.abs(e.clientX-sx));if(moved>4)set(e.clientX)};
 d.onpointerup=()=>{down=false;if(moved<5&&!big)openLb(o,r,d.style.getPropertyValue('--x'))};return d}
function unwrap(d){const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;let t0=0;       /* sweep: original -> enhanced, then settle in the middle */
 (function f(ts){if(!t0)t0=ts;const t=(ts-t0)/2400;if(d._stop)return;if(t>=1){d.style.setProperty('--x','50%');return}
  d.style.setProperty('--x',(t<.65?100-100*ease(t/.65):50*ease((t-.65)/.35))+'%');requestAnimationFrame(f)})(performance.now())}
function openLb(o,r,x){const lb=$('lb');lb.innerHTML='<span class=x>×</span>';
 if(r)lb.appendChild(makeCmp(o,r,true,x));else{const i=document.createElement('img');i.src=o;lb.appendChild(i)}lb.classList.add('on')}
function closeLb(){$('lb').classList.remove('on')}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeLb()});
function showResults(animate){const g=$('grid');g.innerHTML='';RU=S.results.map(b=>URL.createObjectURL(b));
 RU.forEach((u,i)=>{const it=document.createElement('div');it.className='item';const c=makeCmp(OU,u,false,animate?'100%':'50%');it.appendChild(c);
  const b=document.createElement('button');b.className='btn ghost sm';b.style.marginTop='14px';b.textContent=RU.length>1?'Download '+(i+1):'Download';b.onclick=()=>dl(i);it.appendChild(b);g.appendChild(it);if(animate)setTimeout(()=>unwrap(c),500)});
 $('res').classList.remove('hide');if(animate)$('res').scrollIntoView({behavior:'smooth',block:'center'})}
async function dl(i){const fmt=$('fmt').value;let blob=S.results[i];
 if(fmt!='png'){const im=await createImageBitmap(blob),c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');
  if(fmt=='jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0);blob=await new Promise(r=>c.toBlob(r,'image/'+fmt,1))}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='enhanced_'+(i+1)+'.'+(fmt=='jpeg'?'jpg':fmt);a.click()}

/* run / resume (survives page refresh) */
function busy(b){BUSY=b;$('go').disabled=b;$('chg').disabled=b;$('prog').classList.toggle('hide',!b)}
async function go(){if(BUSY)return;if(!S.file){$('st').textContent='Please choose a photo first';return}
 busy(true);S.results=[];$('res').classList.add('hide');
 try{const fd=new FormData();fd.append('photo',S.file);fd.append('prompt_id',SEL);$('st').textContent='Uploading…';
  const id=(await (await api('/enhance',{method:'POST',body:fd})).json()).job_id;S.job=id;await save();await watch(id)}
 catch(e){$('st').textContent=e.message}finally{busy(false)}}
async function resume(id){busy(true);try{await watch(id)}catch(e){$('st').textContent=e.message}finally{busy(false)}}
async function watch(id){const t0=Date.now();let j;
 while(true){await sleep(1500);const r=await fetch('/status/'+id);
  if(r.status==404){S.job=null;save();throw new Error('That job expired. Please press Enhance again.')}
  j=await r.json();$('st').textContent=(j.stage||'Processing')+' · '+Math.round((Date.now()-t0)/1000)+'s';
  if(j.status=='error'){S.job=null;save();throw new Error(j.error)}if(j.status=='done')break}
 S.results=[];for(let n=1;n<=(j.count||1);n++)S.results.push(await (await api('/result/'+id+'/'+n)).blob());
 S.job=null;await save();api('/job/'+id,{method:'DELETE'});showResults(true);$('st').textContent='Done'}
api('/api/me').then(r=>r.json()).then(enter).catch(()=>{});
</script></body></html>
