services:
  aicamera:
    build: .
    container_name: aicamera-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      DATA_DIR: /data
      PORT: ${PORT:-8000}
      ENGINE: ${ENGINE:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TUNNEL: "0"
    volumes:
      - aicamera_data:/data

volumes:
  aicamera_data:
